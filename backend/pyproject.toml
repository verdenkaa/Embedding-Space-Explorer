[project]
name = "ese-backend"
version = "0.1.0"
description = "Local backend for Embedding Space Explorer (research tool for embedding spaces of source code)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.143.1",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# real_model tests download/use actual model weights (~90 MB, opt-in):
#   pytest -m real_model
addopts = "-q -m 'not real_model'"
markers = [
    "real_model: uses the real sentence-transformers model (network + weights; opt-in)",
]
# Put backend/ on sys.path so `import app` works for any launch directory.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# Test fixtures are frozen sample data with known line numbers - never reformat.
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]
# The app ships Russian UI strings on purpose; "ambiguous unicode" warnings
# for Cyrillic Н/Е/с/Т are noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
exclude = ["tests/fixtures/"]

# Heavy ML libraries are imported lazily and used through `object`/ignore
# boundaries in embedding_providers; following their imports makes mypy
# consume gigabytes of RAM for zero benefit.
[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "transformers.*",
    "torch.*",
    "tokenizers.*",
    "huggingface_hub.*",
    "scipy.*",
    "sklearn.*",
    "umap.*",
    "numba.*",
    "pynndescent.*",
    "llvmlite.*",
]
ignore_missing_imports = true
follow_imports = "skip"
